<!DOCTYPE html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Redefinir Palavra-passe | TradeX Global Angola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
      <!-- Favicon & App Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="reset-page-body">
    <header id="mainHeader" class="main-header past-hero">
      <nav class="nav" aria-label="Navegação principal">
        <div class="brand-wrap">
          <a class="brand" href="/#inicio">TRADEX<span>GLOBAL</span></a>
        </div>
        <div class="nav-links" data-shared-nav></div>
        <div class="nav-actions">
          <a href="cliente" class="nav-icon-btn" id="headerUserBtn" aria-label="Área do Cliente" title="Área do Cliente">
            <svg class="header-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </a>
        </div>
      </nav>
    </header>

    <main class="reset-main">
      <section class="reset-card">
        <h1 class="reset-title">Redefinir palavra-passe</h1>
        <p class="reset-lead" id="resetLead">Escolha uma nova palavra-passe para a sua conta TradeX.</p>

        <form id="resetPasswordForm" class="reset-form" novalidate>
          <label for="resetNewPassword" class="proof-upload-label">Nova palavra-passe *</label>
          <input type="password" id="resetNewPassword" class="checkout-input" minlength="8" required autocomplete="new-password" placeholder="Mínimo 8 caracteres" />

          <label for="resetConfirmPassword" class="proof-upload-label">Confirmar palavra-passe *</label>
          <input type="password" id="resetConfirmPassword" class="checkout-input" minlength="8" required autocomplete="new-password" />

          <button type="submit" class="btn-dark btn-full">Guardar nova palavra-passe</button>
          <p class="proof-upload-feedback" id="resetFeedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/reset-password.js"></script>
  </body>
</html>
